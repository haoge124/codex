<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>ChatGPT 翻译插件设置</title>
    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif; margin: 24px; max-width: 760px; }
      textarea { width: 100%; min-height: 120px; }
      button { margin-top: 12px; padding: 8px 14px; }
      .hint { color: #555; }
    </style>
  </head>
  <body>
    <h1>ChatGPT 翻译插件设置</h1>
    <p class="hint">设置右键翻译时给 ChatGPT 的指令。你需要先在浏览器里登录 ChatGPT 才能直接使用。</p>
    <label for="instruction">翻译指令</label>
    <textarea id="instruction"></textarea>
    <br />
    <button id="save">保存</button>
    <span id="status"></span>

    <script src="options.js" type="module"></script>
  </body>
</html>
